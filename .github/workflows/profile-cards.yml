name: profile-cards

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/profile-cards.yml'

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Render contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/snake.svg?color_snake=#79c0ff&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Render cards
        env:
          # GRAPH_TOKEN is optional; the default GITHUB_TOKEN reads public
          # contribution data fine.
          GITHUB_TOKEN: ${{ secrets.GRAPH_TOKEN || secrets.GITHUB_TOKEN }}
          GRAPH_USER: ${{ github.repository_owner }}
        run: |
          node scripts/activity-graph.mjs
          node scripts/streak.mjs
          node scripts/snake.mjs dist/snake.svg

      - name: Commit if changed
        run: |
          # porcelain, not diff: a first-time snake.svg is untracked and diff ignores it
          if [ -z "$(git status --porcelain -- assets)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets
          git commit -m 'chore: refresh profile cards'
          git push
